# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: player_connection
    status: active
    pattern: signal
    producer: network-authority
    consumers:
      - lobby-role-assignment   # removes a lobby leaver at once
      - match-flow              # owns reconnect grace; emits PlayerConnectionChanged
    adr: docs/architecture/adr-0001-hosting-session-join-reconnect.md
    signal_signature: "player_dropped(player_id: int); player_rejoined(player_id: int, new_peer_id: int); player_joined(player_id: int)"
    referenced_by:
      - docs/architecture/adr-0001-hosting-session-join-reconnect.md
    added: 2026-10-12
    revised: ""

  - contract: tick_phases
    status: active
    pattern: direct_call
    producer: network-authority   # TickRunner
    consumers:
      - all-feature-systems       # server_tick(tick) in the order ADR-0005 defines
    adr: docs/architecture/adr-0002-authoritative-sim-tick-input.md
    signal_signature: "server_tick(tick: int) -> void, called once per tick by TickRunner after the movement and snapshot-history phases"
    referenced_by:
      - docs/architecture/adr-0002-authoritative-sim-tick-input.md
    added: 2026-10-12
    revised: ""

  - contract: lag_compensation
    status: active
    pattern: direct_call
    producer: network-authority   # LagCompensation
    consumers:
      - monster-abilities         # Predatory Lunge hit check, every tick of Active
      - survivor-defense          # taser hit-scan
    adr: docs/architecture/adr-0003-lag-compensation-rewind.md
    signal_signature: "LagCompensation.rewind_ticks(attacker_id, tick) -> float (clamped to min(max_rewind_ms 180, server-measured RTT bound)); ray_first_hit(origin, dir, max_dist, targets, skip) -> Dictionary"
    referenced_by:
      - docs/architecture/adr-0003-lag-compensation-rewind.md
    added: 2026-10-12
    revised: ""

  - contract: event_projection
    status: "superseded_by: ADR-0005"   # signature changed: Variant/null -> Dictionary/{}
    pattern: rpc
    producer: every-event-emitter   # each catalog event implements project()
    consumers:
      - network-authority           # batches projected payloads per peer, reliable event channel
    adr: docs/architecture/adr-0004-replication-scope-information-hiding.md
    signal_signature: "project(peer: int, handles: HandleTable) -> Variant (Dictionary payload or null = not sent)"
    referenced_by:
      - docs/architecture/adr-0004-replication-scope-information-hiding.md
    added: 2026-10-12
    revised: "2026-10-12"

  - contract: event_projection
    status: active
    pattern: rpc
    producer: every-event-emitter   # @abstract project() on ServerEvent
    consumers:
      - network-authority           # batches projected payloads per peer, reliable event channel
    adr: docs/architecture/adr-0005-event-catalog-state-registry-tick-order.md
    signal_signature: "project(peer: int, handles: HandleTable) -> Dictionary ({} = not sent to this peer)"
    referenced_by:
      - docs/architecture/adr-0004-replication-scope-information-hiding.md
      - docs/architecture/adr-0005-event-catalog-state-registry-tick-order.md
    added: 2026-10-12
    revised: ""

  - contract: event_bus
    status: active
    pattern: event_bus
    producer: catalog-event-emitters   # only the emitter named in systems-index.md
    consumers:
      - all-feature-systems
    adr: docs/architecture/adr-0005-event-catalog-state-registry-tick-order.md
    signal_signature: "EventBus.emit(e: ServerEvent); subscribe(type: StringName, handler: Callable); flush() drains after each module phase (<= 8 rounds), subscribers in subscribe order; handlers change only their own module's state"
    referenced_by:
      - docs/architecture/adr-0005-event-catalog-state-registry-tick-order.md
    added: 2026-10-12
    revised: ""

  - contract: state_views
    status: active
    pattern: shared_resource
    producer: each-state-owner         # rows of the systems-index.md state table
    consumers:
      - all-feature-systems
    adr: docs/architecture/adr-0005-event-catalog-state-registry-tick-order.md
    signal_signature: "StateRegistry.register_view(key, owner, view) once per key; view(key, ViewClass) asserts type; *View classes expose getters only"
    referenced_by:
      - docs/architecture/adr-0005-event-catalog-state-registry-tick-order.md
    added: 2026-10-12
    revised: ""

  - contract: feature_tick_order
    status: "superseded_by: ADR-0008"   # Holds step inserted between Downing and SurvivorObjectives
    pattern: direct_call
    producer: network-authority   # TickRunner phase 4
    consumers:
      - all-feature-systems
    adr: docs/architecture/adr-0005-event-catalog-state-registry-tick-order.md
    signal_signature: "MatchFlow.begin -> SurvivorDefense -> BorrowedFace -> MonsterAbilities -> Downing -> SurvivorObjectives -> PingsCallouts -> ScareEvents -> MatchFlow.resolve, bus.flush() after each"
    referenced_by:
      - docs/architecture/adr-0005-event-catalog-state-registry-tick-order.md
    added: 2026-10-12
    revised: ""

  - contract: feature_tick_order
