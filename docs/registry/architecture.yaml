# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets:
  - target_fps: 60
    total_frame_budget_ms: 16.6
    platform: PC
    adr: docs/architecture/adr-0002-authoritative-sim-tick-input.md
    added: 2026-10-12
    revised: ""

  - system: server-tick
    status: active
    budget_ms: 2.0
    adr: docs/architecture/adr-0002-authoritative-sim-tick-input.md
    notes: "Whole TickRunner tick on the host for 6 players (input, movement, Feature phases, snapshot build and send). Proposed, not measured: spike measured ~0.16 ms with minimal state; ~10x headroom for real Feature state."
    referenced_by:
      - docs/architecture/adr-0002-authoritative-sim-tick-input.md
    added: 2026-10-12
    revised: ""

