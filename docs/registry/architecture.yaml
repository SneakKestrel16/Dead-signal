# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: peer_id_as_identity
    status: active
    description: "Code outside NetAuthority must not store a peer ID as a player's identity. Key all gameplay and lobby state by player ID."
    why: "A reconnecting player gets a new peer ID; state keyed by peer ID is lost or misattributed on every reconnect."
    adr: docs/architecture/adr-0001-hosting-session-join-reconnect.md
    added: 2026-10-12

  - pattern: host_input_shortcut
    status: active
    description: "The server must not read the host's local input directly. The host's player submits intent through the same queue as remote players."
    why: "Shortcuts give the host rules remote players do not get and break a later headless dedicated build."
    adr: docs/architecture/adr-0001-hosting-session-join-reconnect.md
    added: 2026-10-12

  - pattern: client_to_client_relay
    status: active
    description: "SceneMultiplayer.server_relay must be false; clients never send RPCs or state to each other."
    why: "Every message must pass server validation and per-recipient projection, or hidden information (disguise, discovery, scares) leaks."
    adr: docs/architecture/adr-0001-hosting-session-join-reconnect.md
    added: 2026-10-12

  - pattern: rules_in_own_physics_process
    status: active
    description: "A Feature module must not run rule logic in its own _physics_process. Rules run in TickRunner phases via server_tick(tick)."
    why: "Node process order is not the designed tick order; same-tick rules (stun beats transform, extraction beats deadline) would become order-of-tree accidents."
    adr: docs/architecture/adr-0002-authoritative-sim-tick-input.md
    added: 2026-10-12

  - pattern: wall_clock_rule_timer
    status: active
    description: "Rule timers must count server ticks; they must never read Time or the wall clock."
    why: "A host that falls behind real time would desynchronise wall-clock timers from tick-based ones and break the GDDs' ±1 tick tolerances."
    adr: docs/architecture/adr-0002-authoritative-sim-tick-input.md
    added: 2026-10-12

  - pattern: client_sent_position
    status: active
    description: "Clients must never send position, velocity, speed or progress; only input frames and discrete intents."
    why: "Any client-claimed state is a cheat vector; the server computes all of it (first-person-controller.md rule 9)."
    adr: docs/architecture/adr-0002-authoritative-sim-tick-input.md
    added: 2026-10-12

  - pattern: rewound_eligibility
    status: active
    description: "Hit tests rewind target positions only. Eligibility (Healthy, hidden, grace, Seized), stun state and door/barricade state must be read at the current tick."
    why: "Rewinding state would let a hit land on a survivor who has since hidden or entered grace (monster-abilities.md rule 7)."
    adr: docs/architecture/adr-0003-lag-compensation-rewind.md
    added: 2026-10-12

  - pattern: client_claimed_latency
    status: active
    description: "The rewind amount must be clamped by the server-measured RTT bound (from ack_snapshot_tick), never taken from a client's view_tick or latency claim alone."
    why: "A client claiming high latency would always get the maximum rewind."
    adr: docs/architecture/adr-0003-lag-compensation-rewind.md
    added: 2026-10-12

  - pattern: shapeshifter_id_in_client_payload
    status: active
    description: "During a round, no client-bound payload may contain the shapeshifter's player ID or a stable body ID; bodies are named by per-peer handles."
    why: "Roles are public, so a stable link from a body to the shapeshifter tells a modified client which body is the monster through every disguise."
    adr: docs/architecture/adr-0004-replication-scope-information-hiding.md
    added: 2026-10-12

  - pattern: unprojected_client_event
    status: active
    description: "An event must implement project(peer, handles) to reach any client; broadcasting a server event's raw payload is forbidden."
    why: "One unprojected event leaks per-role secrets (shock identity, scare source, bleed-out state, undiscovered points)."
    adr: docs/architecture/adr-0004-replication-scope-information-hiding.md
    added: 2026-10-12

  - pattern: identifying_node_names
    status: active
    description: "Spawned nodes must use opaque counter names (E%d) and identity-free spawn payloads; never a player ID, role or character in a node name or path."
    why: "Node names and paths reach every peer that receives the node."
    adr: docs/architecture/adr-0004-replication-scope-information-hiding.md
    added: 2026-10-12

  - pattern: gameplay_autoload_service
    status: active
    description: "Gameplay services (TickRunner, EventBus, StateRegistry, Knobs, NetAuthority) and modules must not be autoloads read by name; the round's composition root injects them through setup()."
    why: "Autoloads carry state across rounds and make modules untestable in isolation (coding standard: dependency injection over singletons)."
    adr: docs/architecture/adr-0005-event-catalog-state-registry-tick-order.md
    added: 2026-10-12

  - pattern: direct_cross_system_state_write
    status: active
    description: "A module or event handler must never write another module's state; it reads views and emits events."
    why: "The single-owner rule in systems-index.md; cross writes make tick order and ownership meaningless."
    adr: docs/architecture/adr-0005-event-catalog-state-registry-tick-order.md
    added: 2026-10-12

  - pattern: elementwise_collection_write
    status: active
    description: "Owners must replace collection values exposed through views (packed arrays, arrays, dictionaries) whole; never set an element in place."
    why: "Godot 4.7: setting a packed-array element no longer calls the property setter, so change tracking and replication would miss it."
    adr: docs/architecture/adr-0005-event-catalog-state-registry-tick-order.md
    added: 2026-10-12

  - pattern: inline_layer_numbers
    status: active
    description: "Physics queries and bodies must use PhysicsLayers constants; never inline layer or mask numbers."
    why: "One mask table settles what blocks what (glass blocks bodies, not sight); inline numbers drift."
    adr: docs/architecture/adr-0007-movement-physics-collision-layers.md
    added: 2026-10-12

  - pattern: shared_player_shape
    status: active
    description: "Each player must own its CapsuleShape3D resources (built with .new() or local_to_scene); never share a shape between players."
    why: "Sub-resources in a PackedScene are shared; one player's crouch would resize every capsule."
    adr: docs/architecture/adr-0007-movement-physics-collision-layers.md
    added: 2026-10-12

  - pattern: device_zero_check
    status: active
    description: "Never detect mouse or keyboard input with event.device == 0; test the event type or compare to InputEvent.DEVICE_ID_MOUSE / DEVICE_ID_KEYBOARD."
    why: "Godot 4.7 changed mouse/keyboard device IDs from 0 (docs/engine-reference/godot/breaking-changes.md)."
    adr: docs/architecture/adr-0007-movement-physics-collision-layers.md
    added: 2026-10-12

