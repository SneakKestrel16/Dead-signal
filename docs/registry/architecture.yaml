# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: join_validation
    status: active
    api: SceneMultiplayer.auth_callback + send_auth / complete_auth (both sides)
    not: post-connect handshake RPC
    adr: docs/architecture/adr-0001-hosting-session-join-reconnect.md
    reason: "Rejects before the peer is connected, so no unvalidated peer ever receives game RPCs; verified by the networking spike on 4.7.2 (H5)"
    referenced_by:
      - docs/architecture/adr-0001-hosting-session-join-reconnect.md
    added: 2026-10-12
    revised: ""

  - purpose: network_payload_decoding
    status: active
    api: bytes_to_var (after a size check and per-field type checks)
    not: bytes_to_var_with_objects
    adr: docs/architecture/adr-0001-hosting-session-join-reconnect.md
    reason: "Payloads from peers are untrusted; decoding objects from them would let a client instantiate arbitrary objects on the server"
    referenced_by:
      - docs/architecture/adr-0001-hosting-session-join-reconnect.md
    added: 2026-10-12
    revised: ""

  - purpose: owner_movement_replication
    status: active
    api: custom unreliable per-peer snapshot RPC + owner prediction and replay (CharacterBody3D.move_and_slide in _physics_process)
    not: MultiplayerSynchronizer for player movement
    adr: docs/architecture/adr-0002-authoritative-sim-tick-input.md
    reason: "The synchronizer has no input prediction or replay, so the owner would feel the full round trip; it remains in use for per-peer entity visibility (ADR-0004)"
    referenced_by:
      - docs/architecture/adr-0002-authoritative-sim-tick-input.md
    added: 2026-10-12
    revised: ""

  - purpose: player_hit_test
    status: active
    api: analytic capsule tests in GDScript against RewindHistory samples
    not: PhysicsDirectSpaceState3D.intersect_shape or moving player bodies to rewound positions
    adr: docs/architecture/adr-0003-lag-compensation-rewind.md
    reason: "Shape queries only see bodies at their current transform, which defeats the rewind; analytic tests are cheaper and independent of physics-space timing"
    referenced_by:
      - docs/architecture/adr-0003-lag-compensation-rewind.md
    added: 2026-10-12
    revised: ""

  - purpose: world_line_of_sight
    status: active
    # was (2026-10-12): intersect_ray with a static-geometry-only collision_mask
    api: "PhysicsDirectSpaceState3D.intersect_ray with PhysicsLayers.SIGHT (world) for line of sight and PhysicsLayers.PROJECTILE (world | glass) for taser and dash; doors and barricades tested analytically from Facility Map (door) and Survivor Defense (barricade) state"
    not: ray masks that include the doors or players layers
    adr: docs/architecture/adr-0003-lag-compensation-rewind.md
    reason: "A door toggled this tick may not yet be reflected in the physics space; authoritative state never lags"
    referenced_by:
      - docs/architecture/adr-0003-lag-compensation-rewind.md
    added: 2026-10-12
    revised: "2026-10-12"   # ADR-0003 amended after ADR-0007 named the masks

  - purpose: per_peer_entity_visibility
    status: active
    api: "player bodies: ADR-0002 custom per-peer snapshots only; non-body hidden entities: MultiplayerSpawner + MultiplayerSynchronizer (public_visibility = false, set_visibility_for(peer, true))"
    not: MultiplayerSpawner or MultiplayerSynchronizer for player bodies
    adr: docs/architecture/adr-0004-replication-scope-information-hiding.md
    reason: "Spawned node paths are the same on every peer, so they cannot carry per-peer handles; synchronizer visibility is spike-verified (H4) for the few non-body hidden entities"
    referenced_by:
      - docs/architecture/adr-0004-replication-scope-information-hiding.md
    added: 2026-10-12
    revised: ""

  - purpose: player_body
    status: active
    api: Jolt CharacterBody3D (grounded) + move_and_slide, two per-player CapsuleShape3D built with .new()
    not: RigidBody3D players or a hand-written kinematic controller
    adr: docs/architecture/adr-0007-movement-physics-collision-layers.md
    reason: "Shared movement step for server and prediction (ADR-0002); forces would fight reconciliation"
    referenced_by:
      - docs/architecture/adr-0007-movement-physics-collision-layers.md
    added: 2026-10-12
    revised: ""

  - purpose: step_climbing
    status: active
    api: invisible ramp colliders <= 40 deg on every step; floor_max_angle 40.5 deg, floor_snap_length 0.4
    not: custom step-up code
    adr: docs/architecture/adr-0007-movement-physics-collision-layers.md
    reason: "Meets the controller step and slope ACs with no code that prediction must match"
    referenced_by:
      - docs/architecture/adr-0007-movement-physics-collision-layers.md
    added: 2026-10-12
    revised: ""

  - purpose: gameplay_zones
    status: active
    api: analytic boxes from Facility Map data (MapQueries.volume_at, in_zone)
    not: Area3D for gameplay zones
    adr: docs/architecture/adr-0007-movement-physics-collision-layers.md
    reason: "Deterministic pure functions; no overlap-signal timing; 4.7 Area3D changes avoided"
    referenced_by:
      - docs/architecture/adr-0007-movement-physics-collision-layers.md
    added: 2026-10-12
    revised: ""

  - purpose: interaction_targeting
    status: active
    api: analytic interaction point + radius from map data along the server view ray; intersect_ray on PROJECTILE mask + analytic doors for blocking distance
    not: an interactable physics layer
    adr: docs/architecture/adr-0007-movement-physics-collision-layers.md
    reason: "Same analytic style as ADR-0003; fewer physics objects"
    referenced_by:
      - docs/architecture/adr-0007-movement-physics-collision-layers.md
      - docs/architecture/adr-0008-hold-to-interact-protocol.md
    added: 2026-10-12
    revised: ""

  - purpose: contested_interaction_lock
    status: active
    api: first actor in ADR-0007's rotated player-ID order within the Holds step takes the lock
    not: real-time press order or nearest actor
    adr: docs/architecture/adr-0008-hold-to-interact-protocol.md
    reason: "Deterministic and testable; rotation spreads wins evenly; contests inside one 16.7 ms tick are rare"
    referenced_by:
      - docs/architecture/adr-0008-hold-to-interact-protocol.md
    added: 2026-10-12
    revised: ""

  - purpose: knob_storage
    status: active
    api: "one typed Resource class per system (@export_range fields, NAN / KnobUnset.INT defaults), one .tres per section in res://data/knobs/, loaded by fixed name list with CACHE_MODE_IGNORE; export preset includes data/knobs/*"
    not: JSON or ConfigFile key-value store read by get_float(key); DirAccess enumeration of the knob folder
    adr: docs/architecture/adr-0006-data-driven-configuration.md
    reason: "Knob-name typos fail at parse time; ranges written once in @export_range; exports remap .tres to binary with .remap entries"
    referenced_by:
      - docs/architecture/adr-0006-data-driven-configuration.md
    added: 2026-10-12
    revised: ""

  - purpose: knob_agreement
    status: active
    api: "SHA-256 (HashingContext) over var_to_bytes of sorted script-variable names and values; first 8 hex appended to the ADR-0001 auth version string"
    not: host sending knob values to clients; hashing file bytes
    adr: docs/architecture/adr-0006-data-driven-configuration.md
    reason: "Reuses the existing version_mismatch reject; editor .tres and exported binary differ in bytes but not values"
    referenced_by:
      - docs/architecture/adr-0006-data-driven-configuration.md
      - docs/architecture/adr-0001-hosting-session-join-reconnect.md
    added: 2026-10-12
    revised: ""

  - purpose: volume_lighting_render
    status: active
    api: "dynamic Light3D per volume in fixture groups; visible / light_energy / light_color set from LightingPresets data; ranges clipped to the volume; pre-warmed at load"
    not: baked LightmapGI per state; server-sent per-light values
    adr: docs/architecture/adr-0009-lighting-states-and-blackout.md
    reason: "Per-volume Blackout needs runtime control; looks stay data; Light3D behaviour NOT SOURCEABLE, settled by the ADR-0009 spike"
    referenced_by:
      - docs/architecture/adr-0009-lighting-states-and-blackout.md
    added: 2026-10-12
    revised: ""

  - purpose: scare_flicker
    status: active
    api: "client-generated from a ScareTriggered payload seed; pure function of (seed, elapsed server ticks); clamped to max_flashes_per_s and the flash scale"
    not: server messages per flicker step
    adr: docs/architecture/adr-0009-lighting-states-and-blackout.md
    reason: "One message per scare, identical on every recipient, no network jitter in the pattern"
    referenced_by:
      - docs/architecture/adr-0009-lighting-states-and-blackout.md
    added: 2026-10-12
    revised: ""

  - purpose: surveillance_feed
    status: active
    api: "one SubViewport sharing the main World3D, own Camera3D cull_mask, UPDATE_ALWAYS only while viewing; viewer relevance += viewed camera's visibility set"
    not: one live SubViewport per camera; feeds rendered from client-local knowledge beyond relevance
    adr: docs/architecture/adr-0009-lighting-states-and-blackout.md
    reason: "A feed can show only what the server sent; extending relevance keeps the feed true without leaking beyond the camera's view"
    referenced_by:
      - docs/architecture/adr-0009-lighting-states-and-blackout.md
      - docs/architecture/adr-0004-replication-scope-information-hiding.md
    added: 2026-10-12
    revised: ""

  - purpose: body_appearance
    status: active
    api: "one BodyPuppet Node3D per handle; appearance = child scene from AppearanceSet (res://data/appearances.tres, id 0 true form, 1-5 C1-C5), preloaded and render-warmed at load, swapped in place on FormChanged; C1-C5 share one Skeleton3D bone set and one AnimationLibrary .tres"
    not: despawn/respawn a puppet on form change; all six models per puppet toggled by visible; per-player tint on a shared model
    adr: docs/architecture/adr-0010-borrowed-face-rendering.md
    reason: "A disguise must be structurally identical to the real survivor on every client and keep its handle in view (ADR-0004)"
    referenced_by:
      - docs/architecture/adr-0010-borrowed-face-rendering.md
    added: 2026-10-12
    revised: ""

  - purpose: round_stats
    status: active
    api: "each owner registers a getter-only *StatsView under stats.<system> (downing, abilities, defense, borrowed_face, objectives, match); MatchFlow.resolve reads them once on the outcome tick into RoundResults, sent on RoundEnded as a plain Dictionary"
    not: Match Flow tallying other systems' stats from events; collect_stats() calls on module references; one shared mutable stats store
    adr: docs/architecture/adr-0011-round-stats-and-results-payload.md
    reason: "One owner per number; no module references (ADR-0005); telemetry consumes the RoundEnded payload"
    referenced_by:
      - docs/architecture/adr-0011-round-stats-and-results-payload.md
    added: 2026-10-12
    revised: ""

  - purpose: objective_candidate_selection
    status: active
    api: "Survivor Objectives enumerates every rule-6-valid placement at map load (load fails if none) and draws one per round with an injected RandomNumberGenerator seeded from the logged round seed"
    not: global randi()/randf(); per-type draws with retry loops
    adr: docs/architecture/adr-0012-objective-discovery.md
    reason: "Fixed-seed tests (survivor-objectives AC) and no placement can fail at runtime"
    referenced_by:
      - docs/architecture/adr-0012-objective-discovery.md
    added: 2026-10-12
    revised: ""

  - purpose: flinch_view_offset
    status: active
    api: "Controller owns a per-player FlinchRecord (from, target, start_tick, ramp_ticks); FlinchRecord.offset_at is shared by server and client; ViewOffsetChanged is reliable, owner and spectators only; server evaluates the frame's own record_id record at its offset_tick and adds base[view_epoch]; resets use the epoch handshake; pitch clamp on the sum"
    not: offset in unreliable snapshots; zeroing the offset without a handshake; client camera effects writing yaw/pitch
    adr: docs/architecture/adr-0015-scare-presentation-and-view-offset.md
    reason: "The aim ray uses the server view direction, so the owner must render exactly what the server computes"
    referenced_by:
      - docs/architecture/adr-0015-scare-presentation-and-view-offset.md
      - docs/architecture/adr-0002-authoritative-sim-tick-input.md
    added: 2026-10-12
    revised: ""

  - purpose: scare_client_presentation
    status: active
    api: "ScarePresenter plays ScareCatalog effect lists from ScareTriggered: stinger via AudioDirector, additive ColorRect flash on UiLayers.SCARE_FX, CameraFx shake (client only), P8 edge pulse when flinch is off; every luminance flash passes the shared FlashLimiter (max_flashes_per_s)"
    not: Compositor post-processing flashes; per-source flash caps
    adr: docs/architecture/adr-0015-scare-presentation-and-view-offset.md
    reason: "One 3 flashes/s cap across scare flashes and light flicker (scare-events rule 25)"
    referenced_by:
      - docs/architecture/adr-0015-scare-presentation-and-view-offset.md
      - docs/architecture/adr-0009-lighting-states-and-blackout.md
    added: 2026-10-12
    revised: ""

  - purpose: server_sight_test
    status: active
    api: "SightTest.sees(space, eye, yaw, targets, range_m, fov_deg, doors): distance, then horizontal cone, then intersect_ray on PhysicsLayers.SIGHT + analytic doors; shared by objective discovery and Borrowed Face observation; runs only in TickRunner physics phases; SightTest.line_clear(space, from, to, doors) is the ray-plus-doors part alone, reused by ADR-0013 occlusion"
    not: client-reported visibility; proximity-only or room-entry discovery
    adr: docs/architecture/adr-0012-objective-discovery.md
    reason: "One server rule for 'in view'; a client claim would reveal the route to a cheat"
    referenced_by:
      - docs/architecture/adr-0012-objective-discovery.md
    added: 2026-10-12
    revised: ""

  - purpose: game_audio
    status: active
    api: "AudioDirector plays ADR-0004 positional events from a pooled AudioStreamPlayer3D set via AudioCatalog (max_distance = server send radius); fixed bus tree in default_bus_layout.tres; scripted ducking writes only Ambience and ScareDuck; occlusion by SightTest.line_clear (SIGHT ray plus analytic doors) in the physics step, routing to *Occluded sub-buses; duck counter over non-looping sounds only; footstep masking via per-volume footstep_radius_scale on the server"
    not: sidechain-compressor ducking; Area3D audio bus overrides; mix-only masking of information
    adr: docs/architecture/adr-0013-spatial-audio-pipeline.md
    reason: "Gameplay cues and callouts must never be masked (scare-events rule 18); information masking must change what is sent"
    referenced_by:
      - docs/architecture/adr-0013-spatial-audio-pipeline.md
    added: 2026-10-12
    revised: "2026-10-12 (review 12c, AD-46)"

  - purpose: ui_input_focus
    status: active
    api: "InputContextStack (GAMEPLAY, WHEEL, OVERLAY, MENU, MODAL) is the sole writer of Input.mouse_mode and masks every input frame by the top context's move/look/actions flags; UI on fixed UiLayers CanvasLayers; stock Control focus, grab_focus on push and validated restore on pop; HUD widgets read only HudModel (fed by snapshot handler and ClientEventRouter)"
    not: per-screen mouse-mode writes; relying on GUI event consumption to stop polled movement; HUD widgets reading the router, snapshot or gameplay modules; custom-drawn focus
    adr: docs/architecture/adr-0014-ui-and-input-focus.md
    reason: "Nested screens (overlay then confirm) must restore input and focus exactly; polling ignores GUI consumption"
    referenced_by:
      - docs/architecture/adr-0014-ui-and-input-focus.md
    added: 2026-10-12
    revised: ""

