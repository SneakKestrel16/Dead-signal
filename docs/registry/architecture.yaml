    adr: docs/architecture/adr-0009-lighting-states-and-blackout.md
    signal_signature: "MatchFlow.begin -> SurvivorDefense -> BorrowedFace -> MonsterAbilities -> FacilityMap -> Downing -> Holds -> SurvivorObjectives -> PingsCallouts -> ScareEvents -> MatchFlow.resolve, bus.flush() after each"
