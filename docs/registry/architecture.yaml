      - first-person-controller   # HoldService.server_tick
    adr: docs/architecture/adr-0008-hold-to-interact-protocol.md
    signal_signature: "MatchFlow.begin -> SurvivorDefense -> BorrowedFace -> MonsterAbilities -> Downing -> Holds -> SurvivorObjectives -> PingsCallouts -> ScareEvents -> MatchFlow.resolve, bus.flush() after each"
    referenced_by:
      - docs/architecture/adr-0005-event-catalog-state-registry-tick-order.md
      - docs/architecture/adr-0008-hold-to-interact-protocol.md
    added: 2026-10-12
    revised: ""

  - contract: hold_lifecycle
    status: active
    pattern: direct_call
    producer: first-person-controller   # HoldService
    consumers:
      - survivor-objectives
      - downing-and-rescue
      - survivor-defense
      - monster-abilities             # backup switch
    adr: docs/architecture/adr-0008-hold-to-interact-protocol.md
    signal_signature: "Owners -> HoldService: register(i: Interactable) -> int; unregister(net_id); cancel(actor, reason). HoldService -> Interactable: eligible(actor) -> bool; start_progress_s() -> float; on_start(actor); on_complete(actor); on_cancel(actor, progress_s, reason). Owners emit their own catalog events; HoldService emits none"
    referenced_by:
      - docs/architecture/adr-0008-hold-to-interact-protocol.md
    added: 2026-10-12
    revised: ""

  - contract: interact_intent
    status: active
    pattern: rpc
    producer: all-clients
    consumers:
      - first-person-controller
    adr: docs/architecture/adr-0008-hold-to-interact-protocol.md
    signal_signature: "InputFrame.interact (flags byte; rising edge = Start, falling = Stop); interact_target: int (net id, or per-peer body handle); target_is_body (flags byte). Target read only on the rising edge"
    referenced_by:
      - docs/architecture/adr-0002-authoritative-sim-tick-input.md
      - docs/architecture/adr-0008-hold-to-interact-protocol.md
    added: 2026-10-12
    revised: ""

  - contract: knob_access
    status: active
    pattern: direct_call
    producer: data-config
    consumers:
      - all-systems
    adr: docs/architecture/adr-0006-data-driven-configuration.md
    signal_signature: "Knobs injected through setup(); read knobs.<section>.<name>; Knobs.ticks(seconds) -> int = roundi(seconds * sim_tick_hz); Knobs.load_all() -> Knobs; errors() -> PackedStringArray; digest() -> String"
    referenced_by:
      - docs/architecture/adr-0006-data-driven-configuration.md
      - docs/architecture/adr-0005-event-catalog-state-registry-tick-order.md
    added: 2026-10-12
    revised: ""

  - contract: collision_masks
    status: active
    pattern: shared_resource
    producer: first-person-controller   # PhysicsLayers constants
    consumers:
      - all-systems-issuing-physics-queries
    adr: docs/architecture/adr-0007-movement-physics-collision-layers.md
    signal_signature: "Layers WORLD=1, GLASS=2, DOORS=3, PLAYERS=4. Masks: MOVE_SERVER=world|glass|doors|players; MOVE_PREDICT=world|glass|doors; SIGHT=world (doors analytic); PROJECTILE=world|glass (taser, dash, interaction blocking; doors analytic)"
    referenced_by:
