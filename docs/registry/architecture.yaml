# Architecture Decision Registry
#
# PURPOSE: Single source of truth for key architectural stances that all ADRs
# must agree on. Skills check this before writing new ADRs to detect conflicts
# at authoring time — before stories are created against contradictory decisions.
#
# RULES:
#   - Register a stance when it constrains how OTHER systems must be built.
#     An internal implementation detail that affects only one ADR does not need
#     to be registered.
#   - Never delete entries — set status: superseded_by: ADR-NNNN instead.
#   - When a stance changes: update the entry, set revised: to today's date,
#     add a comment with the old value, and run /architecture-review to check
#     what ADRs are now invalidated.
#   - adr: is the authoritative source. All other ADRs that depend on this
#     stance list themselves in referenced_by.
#
# WRITTEN BY: /architecture-decision (Phase 5 — after ADR is approved)
# READ BY:    /architecture-decision (Step 2 — before authoring begins)
#             /architecture-review (Phase 4 — cross-ADR conflict baseline)
#             /create-stories (to embed architectural constraints in stories)
#             /dev-story (to check implementation against accepted stances)
#
# SEARCH PATTERNS (for skills using Grep):
#   All state owners:       Grep pattern="^  - state:" path="docs/registry/architecture.yaml"
#   Who owns player_health: Grep pattern="state: player_health"
#   All signal contracts:   Grep pattern="pattern: signal"
#   Budget for combat:      Grep pattern="system: combat"
#   All forbidden patterns: Grep pattern="^  - pattern:" (forbidden_patterns section)
#   Superseded entries:     Grep pattern="status: superseded"

version: 1
last_updated: "2026-10-12"

# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: player_identity
    status: active
    owner_system: network-authority
    adr: docs/architecture/adr-0001-hosting-session-join-reconnect.md
    interface: "NetAuthority.player_id_of(peer_id) -> int and peer_id_of(player_id) -> int (read-only; -1 when unbound); session tokens never leave NetAuthority except to their owner"
    write_access: network-authority-only
    referenced_by:
      - docs/architecture/adr-0001-hosting-session-join-reconnect.md
      - docs/architecture/adr-0002-authoritative-sim-tick-input.md   # input queue keyed by player ID
    added: 2026-10-12
    revised: ""

  - state: player_settings
    status: active
    owner_system: network-authority
    adr: docs/architecture/adr-0015-scare-presentation-and-view-offset.md
    interface: "PlayerSettingsView.flinch_enabled(player_id) -> bool (read-only; false for unknown ids); set only by the owning client's reliable set_flinch_enabled(bool) RPC on join and on change, kept in the session record"
    write_access: network-authority-only
    referenced_by:
      - docs/architecture/adr-0015-scare-presentation-and-view-offset.md   # Scare Events and Controller read it
    added: 2026-10-12
    revised: ""

  - state: server_tick
    status: active
    owner_system: network-authority
    adr: docs/architecture/adr-0002-authoritative-sim-tick-input.md
    interface: "TickRunner.current_tick() -> int (read-only); advanced once per _physics_process at sim_tick_hz = 60, set once at boot"
    write_access: network-authority-only
    referenced_by:
      - docs/architecture/adr-0002-authoritative-sim-tick-input.md
      - docs/architecture/adr-0003-lag-compensation-rewind.md
    added: 2026-10-12
    revised: ""

  - state: rewind_history
    status: active
    owner_system: network-authority
    adr: docs/architecture/adr-0003-lag-compensation-rewind.md
    interface: "RewindHistory.sample(player_id, tick: float) -> {ok, pos, height, radius, chest} (read-only); 16 ticks per player, pushed in TickRunner's snapshot-history phase"
    write_access: network-authority-only
    referenced_by:
      - docs/architecture/adr-0003-lag-compensation-rewind.md
    added: 2026-10-12
    revised: ""

  - state: body_handles
    status: active
    owner_system: network-authority
    adr: docs/architecture/adr-0004-replication-scope-information-hiding.md
    interface: "HandleTable.handle_for(peer, player_id) -> int (server-side only; issues and queues an introduce message); retire(peer, player_id); reset_peer(peer) on reconnect or spectator switch"
    write_access: network-authority-only
    referenced_by:
      - docs/architecture/adr-0004-replication-scope-information-hiding.md
    added: 2026-10-12
    revised: ""

  - state: relevance
    status: active
    owner_system: network-authority
    adr: docs/architecture/adr-0004-replication-scope-information-hiding.md
    interface: "Relevance.relevant_bodies(viewer_peer) -> PackedInt32Array (server-side only); computed in the TickRunner send phase from Facility Map visibility sets, 6 m near radius, 0.5 s linger"
    write_access: network-authority-only
    referenced_by:
      - docs/architecture/adr-0004-replication-scope-information-hiding.md
    added: 2026-10-12
    revised: ""

  - state: active_holds
    status: active
    owner_system: first-person-controller   # HoldService
    adr: docs/architecture/adr-0008-hold-to-interact-protocol.md
    interface: "HoldService.hold_of(actor) -> Dictionary {net_id, elapsed_ticks, fake, roots}; {} when idle. Locks keyed by Interactable.lock_key"
    write_access: first-person-controller-only   # owners request cancel(actor, reason); they never write hold state
    referenced_by:
      - docs/architecture/adr-0008-hold-to-interact-protocol.md
    added: 2026-10-12
    revised: ""

  - state: tuning_knobs
    status: active
    owner_system: data-config   # Knobs
    adr: docs/architecture/adr-0006-data-driven-configuration.md
    interface: "knobs.<section>.<name> (typed Resource fields, GDD names unchanged); loaded and validated once at boot; frozen per round"
    write_access: data-config-only   # modules never write knob fields
    referenced_by:
      - docs/architecture/adr-0006-data-driven-configuration.md
    added: 2026-10-12
    revised: ""

  - state: lighting_state
    status: active
    owner_system: facility-map
    adr: docs/architecture/adr-0009-lighting-states-and-blackout.md
    interface: "LightingView (registry key &\"lighting\"): base(), overlays(volume), is_dark(volume), blackout_able(volume); read-only"
    write_access: facility-map-only
    referenced_by:
      - docs/architecture/adr-0009-lighting-states-and-blackout.md
      - docs/architecture/adr-0005-event-catalog-state-registry-tick-order.md   # tick step 4a
    added: 2026-10-12
    revised: ""

